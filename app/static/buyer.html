<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>S2Pay Buyer</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:14px}.top{display:flex;align-items:center;gap:10px;padding:8px 4px 14px}.top img{width:48px;height:48px;border-radius:50%;object-fit:contain}.top h1{font-size:20px;margin:0}.sub{font-size:12px;color:#64748b;margin-top:2px}.request{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:16px;margin-bottom:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.rid{font-weight:800}.status{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:#f1f5f9}.status.SUCCESS{background:#dcfce7;color:#166534}.status.FAILED{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{background:#f8fafc;border-radius:11px;padding:9px 10px}.item small{display:block;color:#64748b;font-size:10px;margin-bottom:3px}.item b{font-size:13px;word-break:break-word}.clientmsg{margin-top:10px;padding:10px;border-left:3px solid #1687ff;background:#f8fbff;border-radius:8px;font-size:13px}.attach{margin-top:10px;font-size:12px;color:#475569}.send{display:flex;gap:7px;margin-top:12px}.send input{flex:1;min-width:0;border:1px solid #d8dee8;border-radius:10px;padding:10px 11px;font-size:13px}.send button{border:0;border-radius:10px;padding:0 13px;background:#1687ff;color:#fff;font-weight:800}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.actions button{border:0;border-radius:10px;padding:10px 4px;font-weight:800;font-size:12px;background:#eef2f7;color:#172033}.actions .success{background:#dcfce7;color:#166534}.actions .failed{background:#fee2e2;color:#991b1b}.empty{text-align:center;color:#64748b;padding:30px}.notice{text-align:center;font-size:12px;color:#64748b;padding:8px}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><img src="/static/logo.png" alt="S2Pay"><div><h1>S2Pay Buyer</h1><div class="sub">Client Requests</div></div></div><div id="list"></div><div id="notice" class="notice"></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const list=document.getElementById('list'),notice=document.getElementById('notice');let fields=[];function auth(){return{Authorization:'tma '+(tg?.initData||'')}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(data){fields=data.fields||[];const rows=data.requests||[];if(!rows.length){list.innerHTML='<div class="request empty">No requests yet.</div>';return}list.innerHTML=rows.map(r=>{const vals=r.field_values||{};const items=fields.filter(f=>f.enabled).map(f=>'<div class="item"><small>'+esc(f.label)+'</small><b>'+esc(vals[f.id]||'—')+'</b></div>').join('');const msg=r.message?'<div class="clientmsg"><b>Client Message</b><br>'+esc(r.message)+'</div>':'';const at=r.screenshot?'<div class="attach">📎 Attachment available in the Buyer Group.</div>':'';return '<section class="request"><div class="head"><div class="rid">Request #'+String(r.id).padStart(4,'0')+'</div><div class="status '+esc(r.status)+'">'+esc(r.status)+'</div></div><div class="grid">'+items+'</div>'+msg+at+'<div class="send"><input id="m-'+r.id+'" placeholder="Write a message about this request..."><button onclick="sendMsg('+r.id+')">Send</button></div><div class="actions"><button onclick="action('+r.id+',\'APP\')">APP</button><button onclick="action('+r.id+',\'OTPV\')">OtpV</button><button class="success" onclick="action('+r.id+',\'SUCCESS\')">সফল</button><button class="failed" onclick="action('+r.id+',\'FAILED\')">অসফল</button></div></section>'}).join('')}async function load(){if(!tg?.initData){notice.textContent='Open Buyer Panel from the Telegram bot.';return}try{const r=await fetch('/api/buyer/requests',{headers:auth()});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not load requests');render(d)}catch(e){notice.textContent='❌ '+e.message}}async function sendMsg(id){const el=document.getElementById('m-'+id),text=el.value.trim();if(!text)return;el.disabled=true;try{const fd=new FormData();fd.append('request_id',id);fd.append('message',text);const r=await fetch('/api/buyer/message',{method:'POST',headers:auth(),body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Message failed');el.value='';notice.textContent='✅ Message sent to client.'}catch(e){notice.textContent='❌ '+e.message}finally{el.disabled=false}}async function action(id,a){try{const fd=new FormData();fd.append('request_id',id);fd.append('action',a);const r=await fetch('/api/buyer/action',{method:'POST',headers:auth(),body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Action failed');notice.textContent='✅ '+a+' updated.';await load()}catch(e){notice.textContent='❌ '+e.message}}load();setInterval(load,10000);</script></body></html>
