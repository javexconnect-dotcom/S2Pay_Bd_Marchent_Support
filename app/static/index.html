<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>S2Pay</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#172033}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e7ebf2;border-radius:20px;padding:20px;box-shadow:0 10px 30px #1d355710;margin-bottom:14px}.brand{text-align:center;margin-bottom:16px}.brand img{width:112px;height:112px;object-fit:contain;border-radius:50%}.brand h1{margin:8px 0 0;font-size:24px}.section-title{font-size:17px;font-weight:800;margin:2px 0 10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;color:#334155;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #d8dee8;border-radius:11px;padding:12px;background:#fff;color:#111827;font-size:15px;outline:none}input:focus,select:focus,textarea:focus{border-color:#1687ff;box-shadow:0 0 0 3px #1687ff18}textarea{resize:vertical;min-height:90px}.pin-note,.hint{font-size:11px;color:#64748b;margin-top:5px}.media{padding:10px;background:#f8fafc}.submit,.send{width:100%;border:0;border-radius:12px;padding:13px;background:#1687ff;color:#fff;font-weight:800;font-size:15px;margin-top:18px}.status{margin-top:12px;text-align:center;font-size:13px;min-height:20px}.required{color:#ef4444}.request{border:1px solid #e5eaf2;border-radius:14px;padding:13px;margin:10px 0;background:#fbfcfe}.request-head{display:flex;justify-content:space-between;gap:10px;font-weight:800}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#eef2f7}.reply-box{margin-top:12px;padding-top:12px;border-top:1px solid #e7ebf2}.small{font-size:12px;color:#64748b}.reply-btn{width:100%;border:0;border-radius:10px;padding:11px;background:#172033;color:#fff;font-weight:800;margin-top:9px}.closed{opacity:.72}@media(max-width:520px){.form-grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><div class="brand"><img src="/static/logo.png" alt="S2Pay"><h1>S2Pay</h1></div><div id="openHint" class="hint"></div><form id="form"><div id="dynamic"></div><label>Access PIN</label><input id="access_pin" autocomplete="off" placeholder="Enter Access PIN (optional)"><div class="pin-note">Optional information only.</div><label>Message</label><textarea id="message" placeholder="Write your requirement or message..."></textarea><label>Media Attachment</label><input class="media" id="screenshot" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf"><button class="submit" type="submit">Submit Request</button><div id="status" class="status"></div></form><div class="hint">Connected to the S2Pay Telegram workflow.</div></div><div class="card"><div class="section-title">📋 My Requests</div><div class="small">Buyer updates and replies for your requests appear here.</div><div id="requests"><div class="small" style="margin-top:10px">Loading…</div></div></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();try{tg?.setHeaderColor?.('#ffffff');tg?.setBackgroundColor?.('#f6f8fc')}catch(_){}const form=document.getElementById('form'),dynamic=document.getElementById('dynamic'),status=document.getElementById('status'),requestsBox=document.getElementById('requests'),openHint=document.getElementById('openHint');let fields=[];function auth(){return{Authorization:'tma '+(tg?.initData||'')}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(){dynamic.innerHTML='';fields.filter(f=>f.enabled).forEach(f=>{const box=document.createElement('div');const lab=document.createElement('label');lab.textContent=f.label;if(f.required){const s=document.createElement('span');s.className='required';s.textContent=' *';lab.appendChild(s)}box.appendChild(lab);if(f.type==='select'){const sel=document.createElement('select');sel.dataset.id=f.id;sel.required=f.required;for(const o of f.options||[]){const opt=document.createElement('option');opt.value=o.value;opt.textContent=o.label;opt.style.color=o.color||'#334155';opt.style.fontWeight='700';sel.appendChild(opt)}box.appendChild(sel)}else{const inp=document.createElement('input');inp.dataset.id=f.id;inp.type=f.type==='number'?'number':'text';inp.required=f.required;box.appendChild(inp)}dynamic.appendChild(box)})}async function loadForm(){if(!tg?.initData){openHint.textContent='Open S2Pay from the Telegram bot to use your account.';status.textContent='Open this page from the Telegram bot.';requestsBox.innerHTML='<div class="small">Telegram account information is unavailable outside the bot.</div>';return}try{const r=await fetch('/api/form-config',{headers:auth()});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not load form');fields=d.fields||[];render();await loadRequests()}catch(e){status.textContent='❌ '+e.message}}async function loadRequests(){try{const r=await fetch('/api/my-requests',{headers:auth()});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not load requests');const rows=d.requests||[];if(!rows.length){requestsBox.innerHTML='<div class="small" style="margin-top:10px">No requests yet.</div>';return}requestsBox.innerHTML=rows.map(x=>{const closed=x.status!=='PROCESSING';return `<div class="request ${closed?'closed':''}" id="request-${x.id}"><div class="request-head"><span>Request #${String(x.id).padStart(4,'0')}</span><span class="badge">${esc(x.status)}</span></div><div class="small" style="margin-top:6px">${esc(x.message||'No message')}</div>${closed?'':'<div class="reply-box"><div class="small">Reply to the Buyer for this request</div><textarea id="reply-'+x.id+'" placeholder="Write your reply..."></textarea><input id="reply-file-'+x.id+'" class="media" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf"><button class="reply-btn" onclick="sendReply('+x.id+')">💬 Send Reply to Buyer</button><div id="reply-status-'+x.id+'" class="status"></div></div>'}</div>`}).join('');const q=new URLSearchParams(location.search).get('request');if(q){document.getElementById('request-'+q)?.scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('reply-'+q)?.focus()}}catch(e){requestsBox.innerHTML='<div class="small">❌ '+esc(e.message)+'</div>'}}async function sendReply(id){const box=document.getElementById('reply-status-'+id),text=document.getElementById('reply-'+id),file=document.getElementById('reply-file-'+id);box.textContent='Sending…';const fd=new FormData();fd.append('text',text.value.trim());if(file.files[0])fd.append('attachment',file.files[0]);try{const r=await fetch('/api/reply/'+id,{method:'POST',headers:auth(),body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Reply failed');box.textContent='✅ Reply sent to Buyer.';text.value='';file.value='';setTimeout(loadRequests,500)}catch(e){box.textContent='❌ '+e.message}}form.addEventListener('submit',async e=>{e.preventDefault();if(!tg?.initData){status.textContent='Open S2Pay from Telegram.';return}const values={};for(const el of dynamic.querySelectorAll('[data-id]'))values[el.dataset.id]=el.value.trim();status.textContent='Submitting…';const fd=new FormData();fd.append('values',JSON.stringify(values));fd.append('access_pin',document.getElementById('access_pin').value.trim());fd.append('message',document.getElementById('message').value.trim());const file=document.getElementById('screenshot').files[0];if(file)fd.append('screenshot',file);try{const r=await fetch('/api/request',{method:'POST',headers:auth(),body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Submission failed');status.textContent='✅ Request #'+String(d.request_id).padStart(4,'0')+' submitted.';form.reset();await loadRequests()}catch(e){status.textContent='❌ '+e.message}});loadForm();</script></body></html>
