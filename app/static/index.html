<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>S2Pay</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#172033}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e7ebf2;border-radius:20px;padding:20px;box-shadow:0 10px 30px #1d355710}.brand{text-align:center;margin-bottom:16px}.brand img{width:112px;height:112px;object-fit:contain;border-radius:50%}.brand h1{margin:8px 0 0;font-size:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;color:#334155;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #d8dee8;border-radius:11px;padding:12px;background:#fff;color:#111827;font-size:15px;outline:none}input:focus,select:focus,textarea:focus{border-color:#1687ff;box-shadow:0 0 0 3px #1687ff18}.select-wrap{position:relative}.color-option{font-weight:700}textarea{resize:vertical;min-height:62px;max-height:130px}.pin-note{font-size:11px;color:#64748b;margin-top:5px}.media{padding:10px;background:#f8fafc}.submit{width:100%;border:0;border-radius:12px;padding:13px;background:#1687ff;color:#fff;font-weight:800;font-size:15px;margin-top:18px}.status{margin-top:12px;text-align:center;font-size:13px;min-height:20px}.required{color:#ef4444}.hidden{display:none}@media(max-width:520px){.form-grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="card"><div class="brand"><img src="/static/logo.png" alt="S2Pay"><h1>S2Pay</h1></div><form id="form"><div id="dynamic"></div><label>Access PIN <span class="required">*</span></label><input id="access_pin" name="access_pin" autocomplete="off" placeholder="Enter your member Access PIN" required><div class="pin-note">Member Access PIN is required to submit this request.</div><label>Message</label><textarea id="message" name="message" placeholder="Write your requirement or message..."></textarea><label>Media Attachment</label><input class="media" id="screenshot" name="screenshot" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf"><button class="submit" type="submit">Submit Request</button><div id="status" class="status"></div></form></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const form=document.getElementById('form'),dynamic=document.getElementById('dynamic'),status=document.getElementById('status');let fields=[];
function auth(){return {Authorization:'tma '+(tg?.initData||'')}}
function render(){dynamic.innerHTML='';fields.filter(f=>f.enabled).forEach(f=>{const box=document.createElement('div');const lab=document.createElement('label');lab.textContent=f.label;if(f.required){const s=document.createElement('span');s.className='required';s.textContent=' *';lab.appendChild(s)}box.appendChild(lab);if(f.type==='select'){const sel=document.createElement('select');sel.dataset.id=f.id;sel.required=f.required;for(const o of f.options||[]){const opt=document.createElement('option');opt.value=o.value;opt.textContent=o.label;opt.style.color=o.color||'#334155';opt.style.fontWeight='700';sel.appendChild(opt)}box.appendChild(sel)}else{const inp=document.createElement('input');inp.dataset.id=f.id;inp.type=f.type==='number'?'number':'text';inp.required=f.required;box.appendChild(inp)}dynamic.appendChild(box)});}
async function load(){if(!tg?.initData){status.textContent='Open this page from the Telegram bot.';return}try{const r=await fetch('/api/form-config',{headers:auth()});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not load form');fields=d.fields||[];render()}catch(e){status.textContent='❌ '+e.message}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!tg?.initData){status.textContent='Open this page from Telegram.';return}const values={};for(const el of dynamic.querySelectorAll('[data-id]'))values[el.dataset.id]=el.value.trim();status.textContent='Submitting…';const fd=new FormData();fd.append('values',JSON.stringify(values));fd.append('access_pin',document.getElementById('access_pin').value.trim());fd.append('message',document.getElementById('message').value.trim());const file=document.getElementById('screenshot').files[0];if(file)fd.append('screenshot',file);try{const r=await fetch('/api/request',{method:'POST',headers:auth(),body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Submission failed');status.textContent=`✅ Request #${String(d.request_id).padStart(4,'0')} submitted.`;form.reset()}catch(e){status.textContent='❌ '+e.message}});load();
</script></body></html>
