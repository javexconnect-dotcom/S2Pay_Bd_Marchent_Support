<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>S2Pay</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef6ff;background:#061019}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#12344b 0,#061019 38%,#04080d 100%);min-height:100vh}.wrap{max-width:720px;margin:auto;padding:16px 14px 28px}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 16px}.brand{display:flex;gap:11px;align-items:center}.brand-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#1687ff,#0bd4c2);display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 8px 24px #1687ff40}.brand h1{margin:0;font-size:22px}.brand p{margin:2px 0 0;color:#7f9aae;font-size:11px}.user{font-size:12px;color:#b9cad7}.card{background:rgba(9,23,33,.88);border:1px solid #1c394b;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 14px 38px #00000035}.hero{padding:20px;background:linear-gradient(135deg,#0b2639,#08151f)}.hero h2{margin:0 0 5px;font-size:22px}.hero p{margin:0;color:#91a8b9;font-size:13px}.section-title{font-size:17px;font-weight:850;margin:0 0 4px}.muted,.small{color:#7f96a7;font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;font-weight:750;color:#b9cad7;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #274556;border-radius:12px;padding:12px;background:#07151f;color:#edf7ff;font-size:15px;outline:none}input:focus,select:focus,textarea:focus{border-color:#1687ff;box-shadow:0 0 0 3px #1687ff20}textarea{resize:vertical;min-height:82px}.media{padding:10px;background:#081722}.submit,.send{width:100%;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,#1687ff,#0b9cff);color:white;font-weight:850;font-size:15px;margin-top:16px}.status{margin-top:10px;text-align:center;font-size:12px;min-height:18px}.required{color:#ff667d}.request{border:1px solid #203d4e;border-radius:16px;padding:14px;margin:10px 0;background:#081722}.request-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.rid{font-weight:850}.badge{font-size:10px;padding:5px 8px;border-radius:999px;background:#173244;color:#a9bfd0}.processing{color:#ffd34d}.success{color:#42e28a}.failed{color:#ff6b7a}.chat{margin-top:12px;border-top:1px solid #183444;padding-top:12px}.bubble{max-width:88%;padding:10px 12px;border-radius:14px;margin:7px 0;font-size:13px;line-height:1.4}.bubble.buyer{background:#112c3d;border:1px solid #1d485e;margin-right:auto}.bubble.client{background:#075b56;border:1px solid #0d8279;margin-left:auto}.bubble.system{background:#17222b;color:#a9bdca;margin:7px auto;text-align:center}.bubble-meta{font-size:9px;color:#718b9b;margin-top:4px}.reply-row{display:flex;gap:7px;margin-top:10px}.reply-row textarea{min-height:48px;resize:none}.send-small{width:50px;border:0;border-radius:12px;background:#1687ff;color:white;font-size:18px}.attach{width:50px;border:1px solid #274556;border-radius:12px;background:#0a1a25;color:#a9bfd0;font-size:18px;overflow:hidden;position:relative}.attach input{position:absolute;inset:0;opacity:0;cursor:pointer}.tabs{display:flex;gap:8px;margin:10px 0}.tab{border:1px solid #1e3b4c;background:#0a1923;color:#91a8b9;border-radius:999px;padding:7px 11px;font-size:11px}.tab.active{background:#1687ff;color:#fff;border-color:#1687ff}.empty{padding:18px;text-align:center;color:#718899;border:1px dashed #234252;border-radius:14px}.hint{font-size:11px;color:#7891a2;margin-top:8px}@media(max-width:520px){.form-grid{grid-template-columns:1fr}.wrap{padding-left:11px;padding-right:11px}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand"><div class="brand-mark">ϟ</div><div><h1>S2Pay</h1><p>Merchant Support</p></div></div><div id="user" class="user"></div></div>
<div class="card hero"><h2>Fast Support. Real Solutions.</h2><p>Submit a request and keep every Buyer message inside S2Pay.</p></div>
<div class="card"><div class="section-title">➕ New Request</div><div class="muted">All required fields are controlled by Admin.</div><form id="form"><div id="dynamic"></div><label>Access PIN</label><input id="access_pin" autocomplete="off" placeholder="Optional"><label>Message</label><textarea id="message" placeholder="Write your requirement or message..."></textarea><label>Media Attachment</label><input class="media" id="screenshot" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf"><button class="submit" type="submit">Submit Request</button><div id="status" class="status"></div></form></div>
<div class="card"><div class="section-title">💬 My Requests & Messages</div><div class="muted">Buyer communication stays inside the app. Nothing is sent to a Telegram group.</div><div id="requests"><div class="small" style="margin-top:10px">Loading…</div></div></div>
</div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();try{tg?.setHeaderColor?.('#061019');tg?.setBackgroundColor?.('#061019')}catch(_){}
const form=document.getElementById('form'),dynamic=document.getElementById('dynamic'),status=document.getElementById('status'),requestsBox=document.getElementById('requests');let fields=[];
function auth(){return{Authorization:'tma '+(tg?.initData||'')}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fmt(t){try{return new Date(t).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}catch(_){return t||''}}
function render(){dynamic.innerHTML='';fields.filter(f=>f.enabled).forEach(f=>{const box=document.createElement('div');const lab=document.createElement('label');lab.textContent=f.label;if(f.required){const s=document.createElement('span');s.className='required';s.textContent=' *';lab.appendChild(s)}box.appendChild(lab);if(f.type==='select'){const sel=document.createElement('select');sel.dataset.id=f.id;sel.required=f.required;(f.options||[]).forEach(o=>{const opt=document.createElement('option');opt.value=o.value;opt.textContent=o.label;sel.appendChild(opt)});box.appendChild(sel)}else{const inp=document.createElement('input');inp.dataset.id=f.id;inp.type=f.type==='number'?'number':'text';inp.required=f.required;box.appendChild(inp)}dynamic.appendChild(box)})}
async function get(url){const r=await fetch(url,{headers:auth()});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function loadForm(){if(!tg?.initData){status.textContent='Open S2Pay from Telegram.';requestsBox.innerHTML='<div class="empty">Please open this Mini App from Telegram.</div>';return}const u=tg.initDataUnsafe?.user;if(u)document.getElementById('user').textContent=(u.first_name||'')+' '+(u.last_name||'');try{const d=await get('/api/form-config');fields=d.fields||[];render();await loadRequests()}catch(e){status.textContent='❌ '+e.message}}
function statusClass(s){return s==='SUCCESS'?'success':s==='FAILED'?'failed':'processing'}
async function loadMessages(id){try{return await get('/api/requests/'+id+'/messages')}catch(e){return{messages:[]}}}
function messageHtml(m){const role=m.sender_role;const cls=role==='CLIENT'?'client':role==='BUYER'?'buyer':'system';const who=role==='CLIENT'?'You':role==='BUYER'?'Buyer':'S2Pay';let body=esc(m.text||'');if(m.file_path){body+=(body?' ':'')+'<a href="/api/interactions/'+m.id+'/attachment" target="_blank" style="color:#7fc9ff">📎 Attachment</a>'}return `<div class="bubble ${cls}"><b>${who}</b><div>${body||'📎 Attachment'}</div><div class="bubble-meta">${esc(fmt(m.created_at))}</div></div>`}
async function sendMessage(id){const text=document.getElementById('msg-'+id),file=document.getElementById('file-'+id),box=document.getElementById('ms-'+id);const fd=new FormData();fd.append('text',text.value.trim());if(file.files[0])fd.append('attachment',file.files[0]);if(!text.value.trim()&&!file.files[0])return;box.textContent='Sending…';try{const r=await fetch('/api/requests/'+id+'/message',{method:'POST',headers:auth(),body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Send failed');text.value='';file.value='';box.textContent='';await openChat(id)}catch(e){box.textContent='❌ '+e.message}}
async function openChat(id){const c=document.getElementById('chat-'+id);if(!c)return;const d=await loadMessages(id);c.innerHTML=(d.messages||[]).map(messageHtml).join('')+`<div class="reply-row"><label class="attach">📎<input id="file-${id}" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf"></label><textarea id="msg-${id}" placeholder="Write a message..."></textarea><button class="send-small" type="button" onclick="sendMessage(${id})">➤</button></div><div id="ms-${id}" class="status"></div>`;c.scrollTop=c.scrollHeight}
async function loadRequests(){try{const d=await get('/api/my-requests');const rows=d.requests||[];if(!rows.length){requestsBox.innerHTML='<div class="empty">No requests yet.</div>';return}requestsBox.innerHTML=rows.map(x=>`<div class="request" id="request-${x.id}"><div class="request-head"><span class="rid">Request #${String(x.id).padStart(4,'0')}</span><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></div><div class="small" style="margin-top:6px">${esc(x.message||'No initial message')} · ${esc(fmt(x.created_at))}</div><div class="chat" id="chat-${x.id}"><div class="empty">Loading conversation…</div></div></div>`).join('');for(const x of rows)await openChat(x.id);const q=new URLSearchParams(location.search).get('request');if(q){document.getElementById('request-'+q)?.scrollIntoView({behavior:'smooth',block:'center'})}}catch(e){requestsBox.innerHTML='<div class="empty">❌ '+esc(e.message)+'</div>'}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!tg?.initData){status.textContent='Open S2Pay from Telegram.';return}const values={};dynamic.querySelectorAll('[data-id]').forEach(el=>values[el.dataset.id]=el.value.trim());status.textContent='Submitting…';const fd=new FormData();fd.append('values',JSON.stringify(values));fd.append('access_pin',document.getElementById('access_pin').value.trim());fd.append('message',document.getElementById('message').value.trim());const f=document.getElementById('screenshot').files[0];if(f)fd.append('screenshot',f);try{const r=await fetch('/api/request',{method:'POST',headers:auth(),body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Submission failed');status.textContent='✅ Request #'+String(d.request_id).padStart(4,'0')+' submitted.';form.reset();await loadRequests()}catch(e){status.textContent='❌ '+e.message}});
loadForm();
</script></body></html>
