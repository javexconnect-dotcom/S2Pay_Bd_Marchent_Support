<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S2Pay Form Settings</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px #1d355710}h1{margin:0 0 6px;font-size:23px}.muted{color:#64748b;font-size:13px}.field{border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin:12px 0;background:#fbfdff}.row{display:grid;grid-template-columns:1fr 130px 110px;gap:8px;align-items:center}input,select{width:100%;padding:9px;border:1px solid #d7dee8;border-radius:9px;box-sizing:border-box}button{border:0;border-radius:9px;padding:9px 12px;font-weight:700;background:#1687ff;color:#fff}.secondary{background:#64748b}.danger{background:#dc2626}.option{display:grid;grid-template-columns:1fr 1fr 62px 38px;gap:6px;margin:7px 0}.switch{width:18px;height:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{margin:8px 0;min-height:20px}@media(max-width:650px){.row{grid-template-columns:1fr}.option{grid-template-columns:1fr 1fr 62px 38px}}</style></head><body><div class="wrap"><div class="card"><h1>⚙️ S2Pay Form Settings</h1><div class="muted">Enable/disable fields, reorder them, add custom fields, and give every dropdown option its own color.</div></div><div id="fields"></div><div class="card"><h3>➕ Add Field</h3><div class="row"><input id="newLabel" placeholder="Field name"><select id="newType"><option value="text">Text</option><option value="select">Select</option><option value="number">Number</option></select><button onclick="addField()">Add</button></div></div><div class="actions"><button onclick="save()">💾 Save Form</button><button class="secondary" onclick="location.reload()">↻ Reload</button></div><div id="status" class="status"></div></div>
<script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let fields=[];function h(){return {Authorization:'tma '+(tg?.initData||'')}}async function load(){if(!tg?.initData){document.getElementById('status').textContent='Open settings from the Telegram bot.';return}const r=await fetch('/api/admin/form-config',{headers:h()});const d=await r.json();if(!r.ok){document.getElementById('status').textContent='❌ '+(d.detail||'Admin only');return}fields=d.fields;render()}function render(){const root=document.getElementById('fields');root.innerHTML='';fields.forEach((f,i)=>{const el=document.createElement('div');el.className='card field';el.innerHTML=`<div class="row"><input value="${esc(f.label)}" oninput="fields[${i}].label=this.value"><label><input class="switch" type="checkbox" ${f.enabled?'checked':''} onchange="fields[${i}].enabled=this.checked"> Enabled</label><label><input class="switch" type="checkbox" ${f.required?'checked':''} onchange="fields[${i}].required=this.checked"> Required</label></div><div class="actions"><button class="secondary" onclick="move(${i},-1)">↑</button><button class="secondary" onclick="move(${i},1)">↓</button>${f.type==='select'?'<button onclick="addOption('+i+')">+ Option</button>':''}</div><div id="opts${i}"></div>`;root.appendChild(el);if(f.type==='select')renderOptions(i)});}function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}function renderOptions(i){const root=document.getElementById('opts'+i);root.innerHTML='';(fields[i].options||[]).forEach((o,j)=>{const d=document.createElement('div');d.className='option';d.innerHTML=`<input value="${esc(o.label)}" oninput="fields[${i}].options[${j}].label=this.value"><input value="${esc(o.value)}" oninput="fields[${i}].options[${j}].value=this.value"><input type="color" value="${o.color||'#64748b'}" onchange="fields[${i}].options[${j}].color=this.value"><button class="danger" onclick="fields[${i}].options.splice(${j},1);render()">×</button>`;root.appendChild(d)})}function addOption(i){fields[i].options=fields[i].options||[];fields[i].options.push({label:'New Option',value:'New Option',color:'#1687ff'});render()}function addField(){const l=document.getElementById('newLabel').value.trim();if(!l)return;const id=l.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')+'_'+Date.now().toString().slice(-4);const type=document.getElementById('newType').value;fields.push({id,label:l,type,enabled:true,required:false,order:fields.length+1,options:type==='select'?[{label:'Please Select',value:'',color:'#64748b'}]:[]});document.getElementById('newLabel').value='';render()}function move(i,d){const j=i+d;if(j<0||j>=fields.length)return;[fields[i],fields[j]]=[fields[j],fields[i]];render()}async function save(){const fd=new FormData();fd.append('payload',JSON.stringify({fields}));const r=await fetch('/api/admin/form-config',{method:'POST',headers:h(),body:fd});const d=await r.json();document.getElementById('status').textContent=r.ok?'✅ Saved successfully':'❌ '+(d.detail||'Save failed');if(r.ok){fields=d.fields;render()}}load();</script></body></html>
